name: stdeel
description: 思谛 STDeel - 拍照识题与 AI 解题学习软件
publish_to: 'none'
version: 0.7.6+23

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

  # 本地数据库
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.0

  # AI API 调用
  langchain_core: ^0.3.0
  langchain_openai: ^0.3.0
  dio: ^5.4.0

  # 拍照/选图
  image_picker: ^1.0.7

  # 文件选择（答案库导入 PDF/Word 等）
  file_picker: ^10.3.10

  # 文档解析：PDF 渲染为图片（扫描件/版面识别走多模态），docx 解压提取文本
  pdfx: ^2.6.0
  archive: ^3.6.0

  # 图片裁切/旋转（纯 Dart 实现）
  image: ^4.2.0

  # UI 组件
  flutter_gen_ai_chat_ui: ^2.0.0

  # 本地通知
  flutter_local_notifications: ^17.0.0

  # 应用版本信息（应用内更新用）
  package_info_plus: ^8.0.0

  # 状态管理
  provider: ^6.1.0

  # 工具
  path_provider: ^2.1.0
  path: ^1.9.0
  crypto: ^3.0.0
  shared_preferences: ^2.2.0

  # 补充依赖
  fl_chart: ^0.67.0   # 知识点雷达图
  collection: ^1.18.0

  # 后台解题保持设备唤醒（防止 Doze/App Standby 挂起网络切断 AI 流）
  wakelock_plus: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.16.0
  build_runner: ^2.4.0
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

# 应用图标生成：dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#141A33"
  adaptive_icon_foreground: "assets/icon/app_icon_fg.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  fonts:
    - family: HarmonyOS Sans SC
      fonts:
        - asset: assets/fonts/HarmonyOS_Sans_SC_Medium.ttf

  assets:
    - assets/icon/
