# -XX:-UseContainerSupport 规避 JDK 17.0.2 在 cgroup v2 容器中 CgroupInfo NPE 导致 JvmWideVariable 初始化失败
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=96m -XX:+HeapDumpOnOutOfMemoryError -XX:-UseContainerSupport
# 受限容器内存上限 4G，限制并发与 worker 数量防止 OOM
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
# 默认 JDK 25 会导致 Kotlin 编译守护进程挂起，需 JDK 17。
# 注意：**不要硬编码 org.gradle.java.home 的绝对路径**——不同构建环境（本地/CI/沙箱）
# 的 JDK 安装路径不同，写死会导致 "Java home supplied is invalid" 构建失败。
# 由构建脚本 scripts/build-release.sh 动态解析并 export JAVA_HOME（Gradle 会采用）。
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=18080
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=18080
