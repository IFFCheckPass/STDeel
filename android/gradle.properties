# -XX:-UseContainerSupport 规避 JDK 17.0.2 在 cgroup v2 容器中 CgroupInfo NPE 导致 JvmWideVariable 初始化失败
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=96m -XX:+HeapDumpOnOutOfMemoryError -XX:-UseContainerSupport
# 受限容器内存上限 4G，限制并发与 worker 数量防止 OOM
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
# 默认 JDK 25 会导致 Kotlin 编译守护进程挂起，改用 JDK 17
org.gradle.java.home=/root/.local/share/mise/installs/java/17.0.2
# 受限容器中 Kotlin daemon 与 Gradle daemon 通信易挂死，改在 Gradle 进程内编译
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=18080
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=18080
